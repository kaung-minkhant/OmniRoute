name: Build Agnes Poll Fix Image

on:
  push:
    branches:
      - ci/build-agnes-poll-fix-image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push patched runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-base
          push: true
          tags: ghcr.io/kaung-minkhant/omniroute:agnes-poll-fix
          cache-from: type=gha
          cache-to: type=gha,mode=max
