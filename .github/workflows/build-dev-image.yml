name: Build Dev Image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: build-dev-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish dev runner image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-base
          push: true
          tags: |
            ghcr.io/kaung-minkhant/omniroute:dev
            ghcr.io/kaung-minkhant/omniroute:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
